name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS so the desktop build is checked too; tests never call Apple (every request is mocked).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: node --test server/test/server.test.js
      - run: flutter build web --release
      - run: flutter build macos --debug
